<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="YardStik Wordmark">
  <defs>
    <linearGradient id="wm-shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c343f"/>
      <stop offset="45%" stop-color="#1f262f"/>
      <stop offset="100%" stop-color="#151a20"/>
    </linearGradient>

    <linearGradient id="wm-silver-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="wm-amber-piping" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="wm-yellow-ruler" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="wm-yellow-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="wm-steel-ruler" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="wm-steel-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <radialGradient id="wm-rivet-head" cx="36%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <filter id="wm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#020406" flood-opacity="0.65" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Scaled 512->168 Precision Ruler Icon Mark -->
  <g transform="translate(16, 16) scale(0.328125)">
    <!-- Canvas Squircle -->
    <rect width="512" height="512" rx="104" fill="#181e25"/>

    <!-- Chamfered Hexagonal Shield -->
    <path d="M 212 56 Q 220 50 234 50 H 278 Q 292 50 300 56 L 434 154 Q 442 160 442 174 V 338 Q 442 352 434 358 L 300 456 Q 292 462 278 462 H 234 Q 220 462 212 456 L 78 358 Q 70 352 70 338 V 174 Q 70 160 78 154 Z"
          fill="url(#wm-shield-bg)" stroke="url(#wm-silver-rim)" stroke-width="8" filter="url(#wm-shadow)"/>
    <path d="M 215 70 Q 222 64 235 64 H 277 Q 290 64 297 70 L 422 161 Q 428 166 428 178 V 334 Q 428 346 422 351 L 297 442 Q 290 448 277 448 H 235 Q 222 448 215 442 L 90 351 Q 84 346 84 334 V 178 Q 84 166 90 161 Z"
          fill="none" stroke="url(#wm-amber-piping)" stroke-width="4.5"/>
    <path d="M 218 80 Q 224 75 236 75 H 276 Q 288 75 294 80 L 413 167 Q 418 171 418 181 V 331 Q 418 341 413 345 L 294 432 Q 288 437 276 437 H 236 Q 224 437 218 432 L 99 345 Q 94 341 94 331 V 181 Q 94 171 99 167 Z"
          fill="#1a2027" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

    <!-- The Folding Ruler "Y" -->
    <g filter="url(#wm-shadow)">
      <!-- Right Steel Arm -->
      <g transform="translate(256, 250) rotate(24) translate(-256, -250)">
        <path d="M 256 94 L 302 88 Q 314 86 316 96 L 316 266 H 256 Z" fill="url(#wm-steel-ruler)"/>
        <path d="M 314 94 L 314 266" stroke="url(#wm-steel-bevel)" stroke-width="4"/>
        <g stroke="#181f27" stroke-linecap="round">
          <line x1="316" y1="108" x2="296" y2="108" stroke-width="3.5"/>
          <line x1="316" y1="122" x2="303" y2="122" stroke-width="2.5"/>
          <line x1="316" y1="136" x2="300" y2="136" stroke-width="3.0"/>
          <line x1="316" y1="150" x2="303" y2="150" stroke-width="2.5"/>
          <line x1="316" y1="164" x2="294" y2="164" stroke-width="3.5"/>
          <line x1="316" y1="178" x2="303" y2="178" stroke-width="2.5"/>
          <line x1="316" y1="192" x2="300" y2="192" stroke-width="3.0"/>
          <line x1="316" y1="206" x2="303" y2="206" stroke-width="2.5"/>
          <line x1="316" y1="220" x2="294" y2="220" stroke-width="3.5"/>
          <line x1="316" y1="234" x2="303" y2="234" stroke-width="2.5"/>
          <line x1="316" y1="248" x2="300" y2="248" stroke-width="3.0"/>
        </g>
      </g>

      <!-- Right Steel Stem Half -->
      <path d="M 256 250 H 286 V 386 Q 286 392 280 392 H 256 Z" fill="url(#wm-steel-ruler)"/>
      <line x1="284" y1="250" x2="284" y2="390" stroke="url(#wm-steel-bevel)" stroke-width="3"/>
      <g stroke="#181f27" stroke-linecap="round">
        <line x1="286" y1="264" x2="268" y2="264" stroke-width="3.5"/>
        <line x1="286" y1="279" x2="274" y2="279" stroke-width="2.4"/>
        <line x1="286" y1="294" x2="271" y2="294" stroke-width="3.0"/>
        <line x1="286" y1="309" x2="274" y2="309" stroke-width="2.4"/>
        <line x1="286" y1="324" x2="266" y2="324" stroke-width="3.5"/>
        <line x1="286" y1="339" x2="274" y2="339" stroke-width="2.4"/>
        <line x1="286" y1="354" x2="271" y2="354" stroke-width="3.0"/>
        <line x1="286" y1="369" x2="274" y2="369" stroke-width="2.4"/>
        <line x1="286" y1="384" x2="266" y2="384" stroke-width="3.5"/>
      </g>

      <!-- Left Yellow Knuckle & Arm -->
      <circle cx="256" cy="250" r="26" fill="url(#wm-yellow-ruler)"/>
      <g transform="translate(256, 250) rotate(-24) translate(-256, -250)">
        <path d="M 196 96 Q 198 86 210 88 L 256 94 V 266 H 196 Z" fill="url(#wm-yellow-ruler)"/>
        <path d="M 198 94 L 198 266" stroke="url(#wm-yellow-bevel)" stroke-width="4"/>
        <g stroke="#181f27" stroke-linecap="round">
          <line x1="196" y1="108" x2="216" y2="108" stroke-width="3.5"/>
          <line x1="196" y1="122" x2="209" y2="122" stroke-width="2.5"/>
          <line x1="196" y1="136" x2="212" y2="136" stroke-width="3.0"/>
          <line x1="196" y1="150" x2="209" y2="150" stroke-width="2.5"/>
          <line x1="196" y1="164" x2="218" y2="164" stroke-width="3.5"/>
          <line x1="196" y1="178" x2="209" y2="178" stroke-width="2.5"/>
          <line x1="196" y1="192" x2="212" y2="192" stroke-width="3.0"/>
          <line x1="196" y1="206" x2="209" y2="206" stroke-width="2.5"/>
          <line x1="196" y1="220" x2="218" y2="220" stroke-width="3.5"/>
          <line x1="196" y1="234" x2="209" y2="234" stroke-width="2.5"/>
          <line x1="196" y1="248" x2="212" y2="248" stroke-width="3.0"/>
        </g>
      </g>

      <!-- Left Yellow Stem Half -->
      <path d="M 226 250 H 256 V 392 H 232 Q 226 392 226 386 Z" fill="url(#wm-yellow-ruler)"/>
      <line x1="228" y1="250" x2="228" y2="390" stroke="url(#wm-yellow-bevel)" stroke-width="3"/>
      <g stroke="#181f27" stroke-linecap="round">
        <line x1="226" y1="264" x2="244" y2="264" stroke-width="3.5"/>
        <line x1="226" y1="279" x2="238" y2="279" stroke-width="2.4"/>
        <line x1="226" y1="294" x2="241" y2="294" stroke-width="3.0"/>
        <line x1="226" y1="309" x2="238" y2="309" stroke-width="2.4"/>
        <line x1="226" y1="324" x2="246" y2="324" stroke-width="3.5"/>
        <line x1="226" y1="339" x2="238" y2="339" stroke-width="2.4"/>
        <line x1="226" y1="354" x2="241" y2="354" stroke-width="3.0"/>
        <line x1="226" y1="369" x2="238" y2="369" stroke-width="2.4"/>
        <line x1="226" y1="384" x2="246" y2="384" stroke-width="3.5"/>
      </g>

      <line x1="256" y1="270" x2="256" y2="392" stroke="#141a20" stroke-width="1.8"/>

      <!-- Center Metallic Rivet -->
      <circle cx="256" cy="250" r="16.5" fill="#14191f" stroke="#0a0e13" stroke-width="1.5"/>
      <circle cx="256" cy="250" r="13.5" fill="url(#wm-rivet-head)" stroke="#475569" stroke-width="0.8"/>
      <circle cx="256" cy="250" r="3.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
      <circle cx="254.5" cy="248.5" r="1.2" fill="#ffffff" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- Right: Bold Geometric YARDSTIK Wordmark + Graduated Ruler Scale Bar -->
  <g transform="translate(212, 0)">
    <!-- Primary Brand Lockup: YARD in #ffffff, STIK in #f59e0b -->
    <text x="0" y="112" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" letter-spacing="3" filter="url(#wm-shadow)">
      <tspan fill="#ffffff">YARD</tspan><tspan fill="#f59e0b">STIK</tspan>
    </text>

    <!-- Horizontal Graduated Ruler Tick Scale Bar (#cbd5e1 & #f59e0b) -->
    <g transform="translate(4, 132)">
      <!-- Scale Track Base Bar -->
      <rect x="0" y="0" width="550" height="8" rx="4" fill="#242b35"/>
      <rect x="0" y="0" width="180" height="8" rx="4" fill="#f59e0b"/>

      <!-- Calibrated Scale Ticks across the Wordmark Base -->
      <g stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#f59e0b" stroke-width="4"/>
        <line x1="36" y1="0" x2="36" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="72" y1="0" x2="72" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="108" y1="0" x2="108" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="144" y1="0" x2="144" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="180" y1="0" x2="180" y2="20" stroke="#f59e0b" stroke-width="4.5"/>
        <line x1="216" y1="0" x2="216" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="252" y1="0" x2="252" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="288" y1="0" x2="288" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="324" y1="0" x2="324" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="360" y1="0" x2="360" y2="20" stroke="#ffffff" stroke-width="4.5"/>
        <line x1="396" y1="0" x2="396" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="432" y1="0" x2="432" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="468" y1="0" x2="468" y2="12" stroke="#64748b" stroke-width="2.5"/>
        <line x1="504" y1="0" x2="504" y2="15" stroke="#94a3b8" stroke-width="3"/>
        <line x1="540" y1="0" x2="540" y2="18" stroke="#f59e0b" stroke-width="4"/>
      </g>

      <!-- Industrial Subtitle -->
      <text x="0" y="44" font-family="'JetBrains Mono', 'Outfit', monospace, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="4">
        RAIL OPERATIONS &amp; SAFETY TELEMETRY
      </text>
    </g>
  </g>
</svg>
