<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .track-bed { stroke: #334155; stroke-width: 14; stroke-linecap: round; fill: none; opacity: 0.6; }
      .track-line { stroke: #475569; stroke-width: 4; stroke-linecap: round; fill: none; }
      .lead-line { stroke: #64748b; stroke-width: 3; stroke-dasharray: 6 6; fill: none; }
      .building { fill: rgba(30, 41, 59, 0.85); stroke: #475569; stroke-width: 2; rx: 6; ry: 6; }
      .building-label { fill: #94a3b8; font-size: 13px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .track-label { fill: #cbd5e1; font-size: 13px; font-weight: 800; cursor: pointer; }
      .switch-point { fill: #0f172a; stroke: #64748b; stroke-width: 2.5; cursor: pointer; }
      .grid-line { stroke: rgba(255,255,255,0.03); stroke-width: 1; }
      .yard-title { fill: #f8fafc; font-size: 22px; font-weight: 900; letter-spacing: 2px; }
      .yard-subtitle { fill: #64748b; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background Grid -->
  <g id="background-grid">
    <line x1="0" y1="100" x2="1400" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1400" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1400" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="1400" y2="400" class="grid-line" />
    <line x1="0" y1="500" x2="1400" y2="500" class="grid-line" />
    <line x1="0" y1="600" x2="1400" y2="600" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="700" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="700" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="700" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="700" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="700" class="grid-line" />
    <line x1="1200" y1="0" x2="1200" y2="700" class="grid-line" />
  </g>

  <!-- Yard Title & Header Details -->
  <g id="yard-header">
    <text x="40" y="45" class="yard-title">INDUSTRIAL RAIL LOGISTICS YARD</text>
    <text x="40" y="65" class="yard-subtitle">SCHEMATIC TRACK LAYOUT &amp; CLASSIFICATION YARD</text>
  </g>

  <!-- Yard Facility Buildings -->
  <g id="buildings-layer">
    <!-- Scale House -->
    <rect x="80" y="90" width="160" height="55" class="building" />
    <text x="160" y="122" class="building-label">SCALE HOUSE</text>

    <!-- Maintenance Shop -->
    <rect x="600" y="90" width="200" height="55" class="building" />
    <text x="700" y="122" class="building-label">MAINTENANCE SHOP</text>

    <!-- Processing Facility -->
    <rect x="1100" y="90" width="240" height="55" class="building" />
    <text x="1220" y="122" class="building-label">PROCESSING PLANT</text>

    <!-- Yard Office -->
    <rect x="1140" y="580" width="200" height="55" class="building" />
    <text x="1240" y="612" class="building-label">YARDMASTER OFFICE</text>
  </g>

  <!-- Main Leads & Ladder Tracks -->
  <g id="ladder-leads">
    <!-- West Ladder Lead -->
    <path id="lead-west" d="M 100 180 L 220 540" class="lead-line" />
    <!-- East Ladder Lead -->
    <path id="lead-east" d="M 1280 180 L 1160 540" class="lead-line" />
    <!-- Lead Inbound / Outbound -->
    <path id="track-lead-inbound" d="M 40 180 L 1360 180" class="track-line" />
    <text x="40" y="172" class="track-label">MAIN LEAD (INBOUND / OUTBOUND)</text>
  </g>

  <!-- Classification Tracks (Tracks 1 to 10) -->
  <g id="tracks-layer">
    <!-- Track 1 -->
    <path id="track-1-bed" d="M 180 220 L 1220 220" class="track-bed" />
    <path id="track-1" data-capacity="15" d="M 180 220 L 1220 220" class="track-line" />
    <text id="label-track-1" x="200" y="212" class="track-label">TRACK 1</text>

    <!-- Track 2 -->
    <path id="track-2-bed" d="M 190 255 L 1210 255" class="track-bed" />
    <path id="track-2" data-capacity="12" d="M 190 255 L 1210 255" class="track-line" />
    <text id="label-track-2" x="210" y="247" class="track-label">TRACK 2</text>

    <!-- Track 3 -->
    <path id="track-3-bed" d="M 200 290 L 1200 290" class="track-bed" />
    <path id="track-3" data-capacity="10" d="M 200 290 L 1200 290" class="track-line" />
    <text id="label-track-3" x="220" y="282" class="track-label">TRACK 3</text>

    <!-- Track 4 -->
    <path id="track-4-bed" d="M 210 325 L 1190 325" class="track-bed" />
    <path id="track-4" data-capacity="14" d="M 210 325 L 1190 325" class="track-line" />
    <text id="label-track-4" x="230" y="317" class="track-label">TRACK 4</text>

    <!-- Track 5 -->
    <path id="track-5-bed" d="M 220 360 L 1180 360" class="track-bed" />
    <path id="track-5" data-capacity="16" d="M 220 360 L 1180 360" class="track-line" />
    <text id="label-track-5" x="240" y="352" class="track-label">TRACK 5</text>

    <!-- Track 6 -->
    <path id="track-6-bed" d="M 230 395 L 1170 395" class="track-bed" />
    <path id="track-6" data-capacity="12" d="M 230 395 L 1170 395" class="track-line" />
    <text id="label-track-6" x="250" y="387" class="track-label">TRACK 6</text>

    <!-- Track 7 -->
    <path id="track-7-bed" d="M 240 430 L 1160 430" class="track-bed" />
    <path id="track-7" data-capacity="10" d="M 240 430 L 1160 430" class="track-line" />
    <text id="label-track-7" x="260" y="422" class="track-label">TRACK 7</text>

    <!-- Track 8 -->
    <path id="track-8-bed" d="M 250 465 L 1150 465" class="track-bed" />
    <path id="track-8" data-capacity="18" d="M 250 465 L 1150 465" class="track-line" />
    <text id="label-track-8" x="270" y="457" class="track-label">TRACK 8</text>

    <!-- Track 9 -->
    <path id="track-9-bed" d="M 260 500 L 1140 500" class="track-bed" />
    <path id="track-9" data-capacity="10" d="M 260 500 L 1140 500" class="track-line" />
    <text id="label-track-9" x="280" y="492" class="track-label">TRACK 9</text>

    <!-- Track 10 -->
    <path id="track-10-bed" d="M 270 535 L 1130 535" class="track-bed" />
    <path id="track-10" data-capacity="15" d="M 270 535 L 1130 535" class="track-line" />
    <text id="label-track-10" x="290" y="527" class="track-label">TRACK 10</text>

    <!-- Track Y (Locomotive Pocket / Engine Spur) -->
    <path id="track-y-bed" d="M 100 600 L 450 600" class="track-bed" />
    <path id="track-y" data-capacity="4" d="M 100 600 L 450 600" class="track-line" />
    <text id="label-track-y" x="120" y="592" class="track-label">TRACK Y (ENGINE SPUR)</text>
  </g>

  <!-- Switch Points & Turnouts -->
  <g id="switches-layer">
    <circle id="switch-1-2-n" cx="180" cy="220" r="6" class="switch-point" />
    <circle id="switch-3-4-s" cx="1190" cy="325" r="6" class="switch-point" />
    <circle id="switch-5-6-n" cx="220" cy="360" r="6" class="switch-point" />
    <circle id="switch-7-8-s" cx="1150" cy="465" r="6" class="switch-point" />
    <circle id="switch-9-10-n" cx="260" cy="500" r="6" class="switch-point" />
    <circle id="switch-y-lead" cx="100" cy="600" r="6" class="switch-point" />
  </g>
</svg>