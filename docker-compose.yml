services:
  kiosk-app:
    image: kiosk-webserver:latest
    build: .
    container_name: ops-kiosk-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      # Sync host timezone to docker container so python has the exact correct time
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # 1. Base website files from the git repo
      - ./html:/usr/share/nginx/html
      # 2. Ephemeral data (reminders, metrics, site config, etc.) mounted over assets/data
      - /opt/kiosk-data/data:/usr/share/nginx/html/assets/data
      # 3. Safety slides: managed on-disk in /opt/kiosk-data/safety-slides
      - /opt/kiosk-data/safety-slides:/usr/share/nginx/html/assets/safety-slides

  control-panel:
    build: ./control-panel
    container_name: ops-control-panel
    restart: always
    ports:
      - "1337:5000"
    volumes:
      - ./control-panel/runners:/app/conf/runners
      - ./control-panel/scripts:/app/scripts
      - ./control-panel/public:/app/public
      - ./control-panel/server.js:/app/server.js
      # Control panel reads/writes ephemeral data and site config from the same host path
      - /opt/kiosk-data/data:/data
      - /opt/kiosk-data/config.json:/opt/config.json
      - /var/run/docker.sock:/var/run/docker.sock
