name: yardstik-prod

services:
  kiosk-app:
    image: yardstik-webserver:latest
    build: .
    container_name: yardstik-app
    restart: always
    depends_on:
      - control-panel
    networks:
      yardstik-prod-net:
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/version.txt || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # Sync host timezone to docker container so python has the exact correct time
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # 1. Base website files and nginx config from the git repo
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html
      # 2. Ephemeral data (reminders, metrics, site config, etc.) mounted over assets/data
      - /opt/kiosk-data/data:/usr/share/nginx/html/assets/data
      # 3. Safety slides: managed on-disk in /opt/kiosk-data/safety-slides
      - /opt/kiosk-data/safety-slides:/usr/share/nginx/html/assets/safety-slides

  control-panel:
    image: yardstik-control-panel:latest
    build: ./control-panel
    container_name: yardstik-control-panel
    restart: always
    environment:
      - KIOSK_CONTAINER=yardstik-app
      - DATA_DIR=/data
      - CONFIG_PATH=/opt/config.json
    networks:
      yardstik-prod-net:
        aliases:
          - control-panel
    ports:
      - "1337:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Sync host timezone to docker container so node/python have the exact correct time
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./control-panel/runners:/app/conf/runners
      - ./control-panel/scripts:/app/scripts
      - ./control-panel/public:/app/public
      - ./control-panel/lib:/app/lib
      - ./control-panel/routes:/app/routes
      - ./control-panel/middleware:/app/middleware
      - ./control-panel/server.js:/app/server.js
      # Control panel reads/writes ephemeral data and site config from the same host path
      - /opt/kiosk-data/data:/data
      - /opt/kiosk-data/config.json:/opt/config.json
      - /opt/kiosk-data/safety-slides:/safety-slides:ro
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  yardstik-prod-net:
    driver: bridge

